<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"></head><body>
<visor-busqueda data-component="busqueda-archivos"><template shadowrootmode="open"><slot></slot></template><div class="file-search-bar" id="fileSearchBar"><div class="file-search-inner">
<i class="fa-solid fa-magnifying-glass"></i><input aria-label="Buscar archivo" autocomplete="off" data-event-input="filtrarArchivos(this.value)" id="inputBuscarArchivo" placeholder="Buscar archivo..." type="search"/><span class="file-search-count" id="fileSearchCount"></span><button class="css-inline-6b99de8b69" data-event-click="limpiarBusquedaArchivos()" id="btnLimpiarBusqueda" title="Borrar búsqueda" type="button"><i class="fa-solid fa-xmark"></i></button><label class="visor-cache-inline" title="Desactiva la caché durante el desarrollo"><input data-event-change="toggleCache(this.checked)" id="cbCacheDesactivada" type="checkbox"/><span id="dev-cache-toggle-text"><i class="fa-solid fa-ban"></i> Caché desactivada</span></label>
</div></div></visor-busqueda>
</body></html>
