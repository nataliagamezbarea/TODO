<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"></head><body>
<visor-navbar data-component="visor-navbar"><template shadowrootmode="open"><slot></slot></template><header aria-label="Navegación principal" class="barra-superior" id="barra-superior"><visor-navbar-izquierda data-component="navbar-izquierda"><template shadowrootmode="open"><slot></slot></template><div class="nav-left">
<navbar-boton-btn-inicio data-component="navbar-boton:btn-inicio"><template shadowrootmode="open"><slot></slot></template><a aria-label="Inicio" class="btn-inicio" href="/" id="btn-inicio" title="Inicio"><i aria-hidden="true" class="fa-solid fa-house"></i></a></navbar-boton-btn-inicio><navbar-boton-volver-atras data-component="navbar-boton:volver-atras"><template shadowrootmode="open"><slot></slot></template><a aria-label="Volver atrás" class="btn-volver" href="/" id="volver-atras" title="Volver atrás"><i aria-hidden="true" class="fa-solid fa-arrow-left"></i></a></navbar-boton-volver-atras><span class="visor-navbar-brand" id="visor-navbar-brand"><i aria-hidden="true" class="fa-solid fa-file-pen"></i><span>Visor de documentos</span></span><navbar-rama data-component="navbar-rama"><template shadowrootmode="open"><slot></slot></template><div class="visor-navbar-rama" id="visor-navbar-rama-box">
<label for="selectRamaGithub"><i aria-hidden="true" class="fa-brands fa-github"></i> Rama</label><select data-event-change="cambiarRamaGithub(this.value)" id="selectRamaGithub"></select>
</div></navbar-rama>
</div></visor-navbar-izquierda>
<visor-navbar-derecha data-component="navbar-derecha"><template shadowrootmode="open"><slot></slot></template><div class="nav-right">
<navbar-boton-visor-btn-resumen data-component="navbar-boton:visor-btn-resumen"><template shadowrootmode="open"><slot></slot></template><button class="visor-navbar-action" data-event-click="openSummaryModal()" id="visor-btn-resumen" type="button"><i aria-hidden="true" class="fa-solid fa-chart-pie"></i><span>Resumen</span></button></navbar-boton-visor-btn-resumen><navbar-boton-visor-btn-sync data-component="navbar-boton:visor-btn-sync"><template shadowrootmode="open"><slot></slot></template><button class="visor-navbar-action" data-event-click="sincronizarGitHub()" id="visor-btn-sync" type="button"><i aria-hidden="true" class="fa-solid fa-cloud-arrow-down"></i><span>Sincronizar GitHub</span></button></navbar-boton-visor-btn-sync><navbar-boton-visor-btn-apuntes data-component="navbar-boton:visor-btn-apuntes"><template shadowrootmode="open"><slot></slot></template><button class="visor-navbar-action" data-event-click="compileAllApuntes()" id="visor-btn-apuntes" type="button"><i aria-hidden="true" class="fa-solid fa-copy"></i><span>Apuntes</span></button></navbar-boton-visor-btn-apuntes><navbar-boton-visor-btn-terminado data-component="navbar-boton:visor-btn-terminado"><template shadowrootmode="open"><slot></slot></template><button class="visor-navbar-action visor-navbar-danger" data-event-click="openLimpiarDatosModal()" id="visor-btn-terminado" type="button"><i aria-hidden="true" class="fa-solid fa-broom"></i><span>Terminado</span></button></navbar-boton-visor-btn-terminado><navbar-boton-btn-modo-oscuro data-component="navbar-boton:btn-modo-oscuro"><template shadowrootmode="open"><slot></slot></template><button aria-label="Cambiar tema" class="btn-modo-oscuro" id="btn-modo-oscuro" title="Modo Oscuro" type="button"><i aria-hidden="true" class="fa-solid fa-moon"></i></button></navbar-boton-btn-modo-oscuro><navbar-boton-boton-ajustes data-component="navbar-boton:boton-ajustes"><template shadowrootmode="open"><slot></slot></template><button aria-label="Ajustes" id="boton-ajustes" title="Ajustes" type="button"><i aria-hidden="true" class="fa-solid fa-gear"></i></button></navbar-boton-boton-ajustes><navbar-boton-btn-cerrar-sesion data-component="navbar-boton:btn-cerrar-sesion"><template shadowrootmode="open"><slot></slot></template><button aria-label="Cerrar sesión" class="btn-cerrar-sesion" id="btn-cerrar-sesion" title="Cerrar sesión" type="button"><i aria-hidden="true" class="fa-solid fa-right-from-bracket"></i></button></navbar-boton-btn-cerrar-sesion>
</div></visor-navbar-derecha></header></visor-navbar>
</body></html>
