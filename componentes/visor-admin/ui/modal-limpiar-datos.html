<div id="modalLimpiarDatos" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)"><div style="background:#130f24;border:1px solid #dc2626;border-radius:10px;padding:24px;width:460px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,0.8);color:#fff"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #374151;padding-bottom:10px"><h3 style="margin:0;font-size:16px;color:#f87171"><i class="fa-solid fa-broom"></i> Limpiar Datos de Revisión (JSON)</h3><button onclick="closeLimpiarDatosModal()" style="background:#374151;color:#fff;border:0;padding:4px 10px;border-radius:4px;cursor:pointer;font-weight:700">✕</button></div><p style="font-size:12px;color:#94a3b8;margin-bottom:16px"> Selecciona qué datos del JSON de revisión deseas eliminar para la rama actual (<b id="lblRamaLimpiar" style="color:#38bdf8"></b>) o si deseas limpiar todo: </p><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;background:#0c0917;padding:12px;border-radius:6px;border:1px solid #2e264d"><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#fca5a5"><input checked="" id="chkLimpiarEnunciados" type="checkbox"/><i class="fa-solid fa-pen-fancy"></i> Enunciados sustituidos </label><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#93c5fd"><input checked="" id="chkLimpiarNombres" type="checkbox"/><i class="fa-solid fa-user-slash"></i> Nombres de autores </label><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#fde047"><input checked="" id="chkLimpiarColegios" type="checkbox"/><i class="fa-solid fa-school"></i> Colegios y Logos </label><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#67e8f9"><input checked="" id="chkLimpiarImagenes" type="checkbox"/><i class="fa-solid fa-image"></i> Acciones de Imágenes </label><hr style="border:0;border-top:1px solid #374151;margin:4px 0"/><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#ef4444;font-weight:700"><input id="chkLimpiarTodo" onchange="toggleCheckTodo(this.checked)" type="checkbox"/><i class="fa-solid fa-triangle-exclamation"></i> ELIMINAR TODO (Limpiar JSON por completo) </label><hr style="border:0;border-top:1px solid #374151;margin:4px 0"/><label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;color:#a78bfa;font-weight:600"><input checked="" id="chkSubirGithubLimpieza" type="checkbox"/><i class="fa-brands fa-github"></i> Actualizar JSON en GitHub </label></div><div style="display:flex;gap:10px;justify-content:flex-end"><button onclick="ejecutarLimpiarDatos()" style="background:#dc2626;color:#fff;border:0;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer"><i class="fa-solid fa-check"></i> Confirmar y Limpiar</button><button onclick="closeLimpiarDatosModal()" style="background:#374151;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer">Cancelar</button></div></div></div>
