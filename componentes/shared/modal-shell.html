<section class="component-modal-shell" data-component="modal-shell"
         role="dialog" aria-modal="true" aria-labelledby="{{TITLE_ID}}" hidden>
  <div class="component-modal-shell__backdrop" data-modal-close></div>
  <div class="component-modal-shell__panel">
    <header class="component-modal-shell__header">
      <div>
        <h2 id="{{TITLE_ID}}">{{TITLE}}</h2>
        <p>{{DESCRIPTION}}</p>
      </div>
      <button type="button" class="component-modal-shell__close" data-modal-close
              aria-label="Cerrar">×</button>
    </header>
    <div class="component-modal-shell__body"><!-- @slot: body --></div>
    <footer class="component-modal-shell__footer"><!-- @slot: footer --></footer>
  </div>
</section>
