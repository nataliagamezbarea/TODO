<div class="component-search" data-component="search-box">
  <label class="sr-only" for="{{INPUT_ID}}">{{LABEL}}</label>
  <span class="component-search__icon" aria-hidden="true">⌕</span>
  <input id="{{INPUT_ID}}" class="component-search__input" type="search"
         placeholder="{{PLACEHOLDER}}" autocomplete="off">
  <button type="button" class="component-search__clear" data-search-clear
          aria-label="Limpiar búsqueda" hidden>×</button>
</div>
