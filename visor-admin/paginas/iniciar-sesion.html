    <main class="login-contenedor">
      <div class="login-tarjeta">
        <div class="login-emoji">💻</div>
        <h1>Acceso al aula</h1>
        <p class="login-sub">Gestión y Visor de Grados Informáticos</p>

        <p id="mensaje-error" class="login-error" hidden></p>

          <button id="btn-google" class="btn btn-google" style="width:100%; justify-content:center; padding:13px; font-size:14px; font-weight:700;">
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

            </svg>
            Entrar con Google
          </button>

          <button id="btn-github" class="btn btn-github" style="width:100%; justify-content:center; padding:13px; font-size:14px; font-weight:700; border-radius: 8px; cursor: pointer;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>

            Entrar con GitHub

          Acceso protegido. Solo se permite el acceso a usuarios autorizados del repositorio.
