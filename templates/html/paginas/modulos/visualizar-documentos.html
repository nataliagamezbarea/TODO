<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Visor y Gestor de Documentos</title>
<link href="../css/visor/base.css" rel="stylesheet"/>
<link href="../css/visor/acciones.css" rel="stylesheet"/>
<link href="../css/componentes/componentes.css" rel="stylesheet"/><link href="../css/componentes/tokens.css" rel="stylesheet"/><script defer="" src="../js/componentes/core.js"></script><link href="../css/componentes/responsive-canonico.css" rel="stylesheet"/><link href="../../../../css/componentes/tema-hover-canonico.css" rel="stylesheet" data-tema-canonico="v12"><script>
(function(){try{
var t=localStorage.getItem('tema');
if(t==='dark'||t==='light'){
document.documentElement.dataset.tema=t;
document.documentElement.classList.toggle('modo-oscuro',t==='dark');
document.documentElement.classList.toggle('modo-claro',t==='light');
}
}catch(e){}})();
</script>
<script>(function(){try{var t=localStorage.getItem('tema');if(t==='dark'||t==='light'){document.documentElement.dataset.tema=t;document.documentElement.classList.toggle('modo-oscuro',t==='dark');document.documentElement.classList.toggle('modo-claro',t==='light');}}catch(e){}})();</script>
<link href="/css/componentes/navbar-tema-final.css" rel="stylesheet"/>
<script src="/js/nucleo/tema-global.js" defer></script>
<script>(function(){try{var q=new URLSearchParams(location.search),o={};q.forEach(function(v,k){if(v)o[k]=v;});if(Object.keys(o).length){var old={};try{old=JSON.parse(localStorage.getItem('app_parametros_ruta')||'{}')}catch(e){}localStorage.setItem('app_parametros_ruta',JSON.stringify(Object.assign(old,o)));}if(location.search||location.hash)history.replaceState({},document.title,location.pathname);}catch(e){}})();</script>
</head>
<body>
<script>
  // Esta ruta SÍ es el acceso directo al visor. No añade ningún botón ni pantalla
  // adicional en la plataforma: simplemente abre el visor integrado/administrativo.
  // Los accesos desde grados, trimestres y tareas siguen siendo los botones junto
  // a las descargas.
  const params = new URLSearchParams(location.search);
  const destino = new URL("../visor-admin/panel-administrador.html", location.href);
  params.forEach((valor, clave) => destino.searchParams.set(clave, valor));
  location.replace(destino.href);
</script>
<script src="/js/nucleo/router.js" defer></script>
</body>
</html>
