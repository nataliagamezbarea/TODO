<div class="blocker modal-admin modal-admin--edit" id="modalEditarEnunciado">
  <div class="blocker-box modal-admin__box">
    <header class="modal-admin__header"><h3><i class="fa-solid fa-pen-fancy"></i> Sustituir Enunciado Detectado</h3><button type="button" class="modal-admin__close" onclick="closeEditarEnunciadoModal()">✕</button></header>
    <div class="modal-admin__fields">
      <label>Texto que quieres cambiar:<textarea id="editarOldText" placeholder="Escribe o modifica exactamente el texto que quieres sustituir..."></textarea></label>
      <label>Nuevo Texto de Enunciado Sustituto:<textarea id="editarNewText" placeholder="Escribe el texto con el que deseas reemplazar el enunciado original..."></textarea></label>
    </div>
    <div class="modal-admin__actions"><button class="btn-act accept" type="button" onclick="guardarEditarEnunciado()"><i class="fa-solid fa-floppy-disk"></i> Guardar y Previsualizar</button><button class="btn-act skip" type="button" onclick="closeEditarEnunciadoModal()">Cancelar</button></div>
  </div>
</div>
